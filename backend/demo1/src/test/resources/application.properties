spring.datasource.url=jdbc:h2:mem:topo_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
topo.bootstrap.enabled=true
topo.jwt.secret=test-only-jwt-secret-please-change-in-production
server.port=0

topo.config-encryption-key=test-only-config-encryption-key
TOPO_ADMIN_PASSWORD=admin
