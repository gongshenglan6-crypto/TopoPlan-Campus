spring.application.name=demo1
server.address=127.0.0.1
server.port=8080

spring.datasource.url=${TOPO_DB_URL:jdbc:mysql://127.0.0.1:3306/topo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${TOPO_DB_USERNAME:root}
spring.datasource.password=${TOPO_DB_PASSWORD}
spring.datasource.driver-class-name=${TOPO_DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=${TOPO_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# Browser access tokens stay in memory; the HttpOnly refresh cookie and Session remain server-side.
server.servlet.session.timeout=${TOPO_SESSION_TIMEOUT:PT8H}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=TOPOSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=${TOPO_SESSION_COOKIE_SECURE:false}

# The project file service applies its stricter 10 MB per-file limit; keep the
# servlet envelope large enough for administrator knowledge-base uploads.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

topo.bootstrap.enabled=${TOPO_BOOTSTRAP_ENABLED:true}
topo.upload-dir=${TOPO_UPLOAD_DIR:uploads}
topo.config-encryption-key=${TOPO_CONFIG_ENCRYPTION_KEY}
topo.jwt.secret=${TOPO_JWT_SECRET}
# Accounting display rate used to convert persisted USD usage costs into RMB.
topo.billing.usd-to-rmb-rate=${TOPO_BILLING_USD_TO_RMB_RATE:7.2}
topo.ai.health.failure-threshold=${TOPO_AI_HEALTH_FAILURE_THRESHOLD:3}
topo.ai.health.cooldown-seconds=${TOPO_AI_HEALTH_COOLDOWN_SECONDS:300}
topo.knowledge.seed-files=${TOPO_KNOWLEDGE_SEED_FILES:../../docs/knowledge/network-basics.md}

# Model-test diagnostics intentionally omit API keys while retaining the final provider URL and error details.
logging.file.name=${TOPO_LOG_FILE:logs/topoplan-backend.log}
logging.level.com.agent.ai.AiGatewayService=INFO
