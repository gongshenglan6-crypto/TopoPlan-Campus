name: topoplan-demo
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: topoplan_demo
      MYSQL_USER: topoplan
      MYSQL_PASSWORD: ${TOPO_DB_PASSWORD:?Configure TOPO_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      TOPO_DB_URL: jdbc:mysql://mysql:3306/topoplan_demo?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      TOPO_DB_USERNAME: topoplan
      TOPO_DB_PASSWORD: ${TOPO_DB_PASSWORD:?Configure TOPO_DB_PASSWORD}
      TOPO_CONFIG_ENCRYPTION_KEY: ${TOPO_CONFIG_ENCRYPTION_KEY:?Configure encryption key}
      TOPO_JWT_SECRET: ${TOPO_JWT_SECRET:?Configure JWT secret}
      TOPO_ADMIN_PASSWORD: ${TOPO_ADMIN_PASSWORD:?Configure administrator password}
      TOPO_SESSION_COOKIE_SECURE: ${TOPO_SESSION_COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:${TOPO_DEMO_PORT:-8188}:8080"
    volumes:
      - app-data:/data
  https:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DEMO_HOST: ${DEMO_HOST:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  mysql-data:
  app-data:
  caddy-data:
  caddy-config:
